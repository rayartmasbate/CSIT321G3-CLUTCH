spring.application.name=clutch

#MySQL Datasource Settings
spring.datasource.url=jdbc:mysql://localhost:3307/dbclutch

#Setup db login credentials
spring.datasource.username=root
spring.datasource.password=

#Auto create tables based on entities
spring.jpa.hibernate.ddl-auto=update

#for stack trace error not to appear
server.error.include-stacktrace=never
server.port = 8080